{% extends "u2/base.html" %}
{% block title %}Уроки{% endblock %}
{% block content %}
<h1 class="u2-h1">Уроки, {{ grade }} класс</h1>
<p class="jr-lead">Выбери предмет.</p>
{% for s in items %}
<a class="u2-card u2-link jr-card" href="/u2/p/{{ s.id }}">
  <div class="u2-card-head"><h2>{{ s.emoji }} {{ s.title }}</h2></div>
  <p class="jr-score">Верно {{ s.done }} из {{ s.total }}</p>
</a>
{% endfor %}
{% endblock %}
