version: 1
subject: russian
kind: rules
rules:
- id: odn
  title: Однородные члены
  text: 'Между однородными членами без союзов ставится запятая. Перед союзами а, но,
    да (= но) — запятая. Одиночный союз и запятой не отделяется: «хлеб и сыр». Повторяющиеся
    союзы и…и, ни…ни, то…то — запятая перед вторым и следующими.'
- id: obr
  title: Обращение
  text: 'Слово, которым называют того, к кому обращаются, выделяется запятыми с обеих
    сторон: «Саша, подожди», «Скажи, Петя, ты готов?».'
- id: vvod
  title: Вводные слова
  text: 'Слова, которыми говорящий выражает отношение (наверное, конечно, к счастью,
    по-моему, кажется), выделяются запятыми. Их можно убрать без потери смысла. Не
    вводные: вдруг, обязательно, даже, будто, вряд ли, всё-таки — запятыми не выделяются.'
- id: prich
  title: Причастный оборот
  text: 'Причастный оборот обособляется, если стоит после слова, к которому относится:
    «мальчик, сидящий у окна, …». Перед словом — без запятых: «сидящий у окна мальчик».'
- id: deepr
  title: Деепричастный оборот
  text: 'Деепричастие и деепричастный оборот выделяются запятыми с обеих сторон, где
    бы они ни стояли: «Закончив уроки, брат пошёл гулять». Устойчивые выражения (не
    покладая рук, сломя голову) не обособляются.'
- id: sravn
  title: Сравнительный оборот
  text: 'Оборот со словами как, словно, будто, точно выделяется запятыми: «снег блестел,
    как серебро». Устойчивые выражения не выделяются: «лил как из ведра».'
- id: slozh
  title: Сложное предложение
  text: Между частями сложного предложения (в каждой — своё подлежащее и сказуемое)
    ставится запятая, в том числе перед и, что, когда, потому что.
- id: nn_adj
  title: Н и НН в прилагательных
  text: 'НН — на стыке корня на -н и суффикса -н- (лимон+н → лимонный), в суффиксах
    -онн-, -енн- (искусственный). Н — в суффиксах -ан-, -ян-, -ин- (кожаный, серебряный,
    лебединый). Исключения: стеклянный, оловянный, деревянный, ветреный.'
- id: nn_part
  title: Н и НН в причастиях
  text: 'НН — если есть приставка (зажаренная), зависимое слово (раненный в руку)
    или суффикс -ова-/-ева- (маринованный). Н — в одиночном слове без приставки (жареная
    картошка). Приставка не- на это не влияет. Исключения: кованый, жёваный.'
- id: ne
  title: НЕ с разными частями речи
  text: 'С глаголами и деепричастиями — раздельно (не знал). Слитно — если без не
    слово не употребляется (ненавидеть, негодовать) или можно заменить синонимом без
    не (невысокий = низкий). Раздельно при противопоставлении с а (не правда, а ложь).
    Причастие: одиночное — слитно, с зависимым словом — раздельно.'
- id: pre_pri
  title: Приставки ПРЕ и ПРИ
  text: 'ПРИ — приближение, присоединение, близость, неполнота (приехать, пришить,
    привокзальный, приоткрыть). ПРЕ — значение «очень» или «пере-» (прекрасный, преодолеть).
    Есть слова, которые надо запомнить: пренебрегать, преграда, привередливый.'
- id: tsya
  title: -ТСЯ и -ТЬСЯ
  text: Задай вопрос к глаголу. Что делает? — -тся (он учится). Что делать? — -ться
    (надо учиться). Есть ь в вопросе — есть ь в глаголе.
- id: alt_lag
  title: Корни ЛАГ/ЛОЖ
  text: 'Перед г пишется а, перед ж — о: предлагать, положить.'
- id: alt_rast
  title: Корни РАСТ/РОС
  text: 'Перед ст и щ пишется а (растение, выращенный), иначе о (вырос). Исключения:
    росток, ростовщик, отрасль, Ростов.'
- id: alt_kas
  title: Корни КАС/КОС
  text: 'Если после корня суффикс -а-, пишется а: касаться. Нет -а- — о: коснуться.'
- id: alt_gor_zar
  title: Корни ГАР/ГОР и ЗАР/ЗОР
  text: 'Без ударения в корне гор пишется о (загорать, горелый), в корне зар — а (заря,
    озарять). Под ударением — как слышим: загар, зорька.'
- id: alt_i_a
  title: Корни БЛЕСТ/БЛИСТ, МЕР/МИР и другие с суффиксом -а-
  text: 'Если после корня суффикс -а-, в корне пишется и: блистать, замирать. Нет
    -а- — е: блестеть, замереть.'
- id: o_yo
  title: О и Ё после шипящих
  text: В корне под ударением пишется Ё, если есть родственное слово с Е (жёлтый —
    желтеть). Без такой проверки — О (шорох, шоколад). В суффиксах существительных
    и прилагательных под ударением — О (речонка), но в словах от глаголов — Ё (тушёнка).
- id: soft
  title: Ь после шипящих
  text: У существительных женского рода в конце ь пишется (ночь, рожь), мужского —
    нет (мяч, камыш). В глаголах повелительного наклонения ь пишется (плачь!).
- id: pril
  title: Приложение
  text: 'Приложение — другое название предмета. Распространённое приложение после
    главного слова выделяется запятыми: «Мой брат, ученик девятого класса, играет
    в шахматы».'
- id: mezhd
  title: Междометия, да и нет
  text: 'Междометия (ах, ой, эх) и слова да, нет в начале ответа отделяются запятой:
    «Ах, какой вечер!», «Да, я приду», «Нет, не согласен».'
- id: pref_zs
  title: З и С на конце приставок
  text: Перед звонкой согласной и гласной — з (раздать, безоблачный, безвкусный),
    перед глухой — с (бесполезный, исписать, рассказать).
- id: nar_oa
  title: О и А на конце наречий
  text: Приставки из-, до-, с- — на конце а (издалека, досуха, слева). Приставки в-,
    на-, за- — на конце о (вправо, насухо, засветло).
- id: nar_sh
  title: Ь на конце наречий после шипящих
  text: 'После шипящих на конце наречий ь пишется: настежь, вскачь, прочь, наотмашь.
    Исключения: уж, замуж, невтерпёж.'
- id: ne_ni
  title: НЕ и НИ в отрицательных местоимениях
  text: 'Под ударением пишется не, без ударения — ни: нéкого спросить — никогó не
    видел, нéчем заняться — ничéм не занят, нéкогда отдохнуть — никогдá не сдавался.'
- id: chik
  title: Суффиксы -ЧИК- и -ЩИК-
  text: После д, т, з, с, ж пишется -чик (разведчик, переводчик, перебежчик), после
    остальных согласных — -щик (каменщик, сварщик, барабанщик).
- id: ek_ik
  title: Суффиксы -ЕК- и -ИК-
  text: 'Измени слово: если гласная выпадает — пишется -ек (замочек — замочка), если
    остаётся — -ик (ключик — ключика).'
- id: tsy
  title: Ы и И после Ц
  text: 'В корне после ц пишется и (цирк, цифра, станция), в окончаниях — ы (огурцы,
    птицы). Исключения: цыган, цыплёнок, на цыпочках, цыц.'
- id: basis
  title: Грамматическая основа
  text: 'Подлежащее отвечает на вопрос кто? что? — его подчёркивают одной чертой.
    Сказуемое — что делает? каков? кто такой? — двумя чертами. Частица не входит в
    сказуемое: «не знаю». Подлежащим бывает местоимение (я, кто-то) и сочетание слов:
    «мы с братом», «два мальчика». Причастие и деепричастие — не сказуемое.'
- id: basis_sost
  title: Составное сказуемое
  text: 'Сказуемое бывает из нескольких слов: «хочу поехать», «начал читать», «будем
    решать» — глагол и инфинитив; «был весёлым», «станет врачом» — связка и именная
    часть.'
- id: basis_odno
  title: Односоставные предложения
  text: 'Бывает, что главный член один. Только сказуемое: «Светает», «Мне холодно»,
    «Ищу друга», «В дверь постучали». Только подлежащее — назывное предложение: «Морозное
    утро».'
- id: fig
  title: Средства выразительности
  text: Эпитет — образное определение (золотая осень). Метафора — скрытое сравнение,
    один предмет называется другим (глаза — звёзды). Олицетворение — неживому приписываются
    свойства живого (ветер завывает). Сравнение — сопоставление через «как», «словно»,
    «будто».
