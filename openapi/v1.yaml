openapi: 3.0.3
info:
  title: umedu API
  version: "1.0.0"
  description: >
    Живые пути этапов 1–5: конфиг, каталог, условие номера и проверка попытки, онбординг гостем,
    запись попыток и прогноз, регистрация и вход по почте/username, выход, план на сегодня и серия.
    Попытка без токена ничего не пишет; с токеном сессии гостя — пишется и идемпотентна (один ключ —
    одна попытка). Вход VK ID/Яндекс ID и аккаунты до 14 лет (родитель) — не реализованы. Не раньше,
    чем сервер на них ответит.
servers:
  - url: https://umedu.ru
paths:
  /api/v1/config:
    get:
      operationId: getConfig
      summary: Флаги и минимальная сборка
      responses:
        "200":
          description: Текущий конфиг. Нет записи в базу.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
  /api/v1/catalog:
    get:
      operationId: getCatalog
      summary: Экзамены и предметы
      responses:
        "200":
          description: Каталог из кода. Нет записи в базу.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
  /api/v1/tasks/{exam_id}/{n}:
    get:
      operationId: getTask
      summary: Условие номера по варианту
      description: >
        Вариант пересобирается из (exam_id, номер, seed) — детерминировано, как в тренажёре сайта.
        В ответе нет ответа и разбора: их отдаёт только попытка. Выключенный тренажёр — 503.
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
        - name: n
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: seed
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999999
      responses:
        "200":
          description: Условие номера. Нет записи в базу.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/v1/numbers/{exam_id}:
    get:
      operationId: getNumbers
      summary: Список номеров заданий, которые сервер умеет генерировать для экзамена
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Список номеров.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumbersOut"
        "404":
          description: Экзамен не найден.
  /api/v1/errors/{exam_id}:
    get:
      operationId: getErrors
      summary: Последние ошибки ученика по экзамену
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Список ошибок.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorsOut"
        "401":
          description: Нужна авторизация.
  /api/v1/me:
    get:
      operationId: getMe
      summary: Профиль текущего ученика
      responses:
        "200":
          description: Профиль.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOut"
        "401":
          description: Нужна авторизация.
  /api/v1/account:
    delete:
      operationId: deleteAccount
      summary: Удалить аккаунт ученика
      responses:
        "204":
          description: Удалено.
        "401":
          description: Нужна авторизация.
        "403":
          description: Нельзя удалить.
  /api/v1/crashes:
    post:
      operationId: postCrash
      summary: Отчёт о сбое приложения
      responses:
        "204":
          description: Принято.
        "503":
          description: Отключено.
  /api/v1/skills/{exam_id}:
    get:
      operationId: getSkills
      summary: Дерево навыков экзамена с мастерством ученика
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Список навыков.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsOut"
        "401":
          description: Нужна авторизация.
  /api/v1/theory:
    get:
      operationId: getTheory
      summary: Шпаргалка (теория) по урокам Python
      responses:
        "200":
          description: Список уроков с примерами.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TheoryOut"
  /api/v1/sessions:
    post:
      operationId: postSession
      summary: Онбординг гостем
      description: >
        Создаёт гостя без учётки и возвращает токен. Повтор с тем же device_id выдаёт новый токен
        тому же гостю — знания и попытки на месте (created: false). Лимит — 20 сессий в час с адреса (429).
        Выключенный онбординг — 503 (флаг guests в /config).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionIn"
      responses:
        "200":
          description: "Токен существующей сессии device_id (created: false)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "201":
          description: "Новый гость (created: true)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          description: Слишком много сессий с адреса.
        "503":
          description: Онбординг гостей на паузе.
  /api/v1/attempts:
    post:
      operationId: postAttempt
      summary: Проверка попытки
      description: >
        Ключ идемпотентности придумывает клиент (UUID). Один ключ — одна попытка: повтор с тем же
        ключом возвращает сохранённый вердикт; тот же ключ с другим запросом — 422.
        Без заголовка Authorization попытка ничего не пишет (очередь попыток — на телефоне).
        С заголовком "Bearer <токен сессии гостя>" попытка пишется в знания гостя и идёт в прогноз.
      security:
        - guestSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptIn"
      responses:
        "200":
          description: Вердикт, верный ответ и разбор.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptOut"
        "401":
          description: Токен передан, но сессии нет или она удалена — создать новую.
        "422":
          description: Ключ идемпотентности уже использован с другим запросом.
  /api/v1/forecast/{exam_id}:
    get:
      operationId: getForecast
      summary: Прогноз балла гостя
      description: >
        Ожидаемый первичный балл, вилка 80% и отметка или тестовый балл по шкале экзамена — тот же
        расчёт, что на сайте. Только с токеном сессии гостя; без него — 401. Выключенный тренажёр — 503.
      security:
        - guestSession: []
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Прогноз по попыткам гостя (пока попыток нет — стартовые значения).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"
        "401":
          description: Нет токена или сессия не найдена.
        "404":
          description: Неизвестный exam_id.
        "503":
          description: Тренажёр на паузе.
  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      summary: Регистрация по почте, 14+
      description: >
        Создаёт аккаунт ученика и возвращает токен входа. С заголовком "Bearer <токен сессии гостя>"
        гость становится аккаунтом (created: false) — тот же user_id, знания и попытки на месте,
        гостевой токен продолжает работать. С токеном уже вошедшего — новый отдельный аккаунт.
        Младше 14 — 403 (аккаунт создаёт родитель на сайте, в API пока нет). Лимит — 10 регистраций
        в час с адреса (429). Выключенный вход — 503 (флаг auth в /config).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterIn"
      responses:
        "200":
          description: "Новый аккаунт (created: true) или апгрейд гостя (created: false)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auth"
        "403":
          description: Младше 14 — аккаунт создаёт родитель.
        "409":
          description: Эта почта или логин уже заняты.
        "422":
          description: Некорректная почта, короткий пароль или дата рождения из будущего.
        "429":
          description: Слишком много регистраций с адреса.
        "503":
          description: Вход на паузе.
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Вход по почте или username
      description: >
        Те же учётные данные, что на сайте: почта или username ученика и пароль. Только ученики —
        аккаунт преподавателя — 403. Неудачные попытки ограничены: 10 за 15 минут с адреса — 429.
        Выключенный вход — 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginIn"
      responses:
        "200":
          description: "Токен входа (created: false)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auth"
        "401":
          description: Неверный логин или пароль.
        "403":
          description: В приложении вход только для учеников.
        "429":
          description: Слишком много неудачных попыток — подождать 15 минут.
        "503":
          description: Вход на паузе.
  /api/v1/session:
    delete:
      operationId: deleteSession
      summary: Выход
      description: >
        Удаляет сессию по токену — и гостевую, и входа. Токен больше не работает.
      security:
        - guestSession: []
      responses:
        "204":
          description: Сессия удалена.
        "401":
          description: Нет токена или сессия не найдена.
  /api/v1/today/{exam_id}:
    get:
      operationId: getToday
      summary: План на сегодня и серия занятий
      description: >
        Тот же расчёт, что «Сегодня» на сайте: повторения с подошедшим сроком, затем номера с
        наибольшим приростом баллов за минуту; в плане только номера, которые приложение само
        выдаёт и проверяет. minutes — дневная норма (по умолчанию 30); делить её между предметами
        будет клиент. activity — серия дней и неделя пн–вс; напоминание о занятии — на стороне
        приложения. Выключенный тренажёр — 503.
      security:
        - guestSession: []
      parameters:
        - name: exam_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: План дня по попыткам ученика (новому гостю — стартовый план) и серия.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Today"
        "401":
          description: Нет токена или сессия не найдена.
        "404":
          description: "Неизвестный exam_id или у экзамена нет номеров для приложения."
        "503":
          description: Тренажёр на паузе.
components:
  securitySchemes:
    guestSession:
      type: http
      scheme: bearer
      description: "Токен из POST /api/v1/sessions; передаётся заголовком Authorization: Bearer <токен>."
  schemas:
    Config:
      type: object
      additionalProperties: false
      required: [schema_version, hard_min_build, flags, notice]
      properties:
        schema_version:
          type: integer
          enum: [1]
        hard_min_build:
          type: integer
          minimum: 1
        flags:
          $ref: "#/components/schemas/Flags"
        notice:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Notice"
    Flags:
      type: object
      additionalProperties: false
      required: [trainer, trial, crash_reports, guests, auth]
      properties:
        trainer:
          type: boolean
        trial:
          type: boolean
        crash_reports:
          type: boolean
        guests:
          type: boolean
        auth:
          type: boolean
    Notice:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [paused, info]
        text:
          type: string
    Catalog:
      type: object
      additionalProperties: false
      required: [schema_version, tracks]
      properties:
        schema_version:
          type: integer
          enum: [1]
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
    Track:
      type: object
      additionalProperties: false
      required: [id, title, year, subjects]
      properties:
        id:
          type: string
        title:
          type: string
        year:
          type: integer
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/Subject"
    Subject:
      type: object
      additionalProperties: false
      required: [id, exam_id, title, status, required, max_points]
      properties:
        id:
          type: string
        exam_id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [live, soon]
        required:
          type: boolean
        max_points:
          type: integer
          minimum: 1
    Task:
      type: object
      additionalProperties: false
      required: [schema_version, exam_id, n, seed, text]
      properties:
        schema_version:
          type: integer
          enum: [1]
        exam_id:
          type: string
        n:
          type: integer
          minimum: 1
        seed:
          type: integer
          minimum: 1
          maximum: 9999999
        text:
          type: string
        table:
          type: array
          items:
            type: array
            items:
              type: string
        code:
          type: string
        svg:
          type: string
    AttemptIn:
      type: object
      additionalProperties: false
      required: [idempotency_key, exam_id, n, seed, answer]
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        exam_id:
          type: string
        n:
          type: integer
          minimum: 1
        seed:
          type: integer
          minimum: 1
          maximum: 9999999
        answer:
          type: string
          minLength: 1
          maxLength: 100
    AttemptOut:
      type: object
      additionalProperties: false
      required: [schema_version, idempotency_key, ok, answer, explain, steps]
      properties:
        schema_version:
          type: integer
          enum: [1]
        idempotency_key:
          type: string
        ok:
          type: boolean
        answer:
          type: string
        explain:
          type: string
        steps:
          type: array
          items:
            type: string
    SessionIn:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id:
          type: string
          minLength: 8
          maxLength: 128
    Session:
      type: object
      additionalProperties: false
      required: [schema_version, token, created]
      properties:
        schema_version:
          type: integer
          enum: [1]
        token:
          type: string
        created:
          type: boolean
    Forecast:
      type: object
      additionalProperties: false
      required: [schema_version, exam_id, primary, low, high]
      properties:
        schema_version:
          type: integer
          enum: [1]
        exam_id:
          type: string
        primary:
          type: number
        low:
          type: integer
        high:
          type: integer
        grade:
          type: integer
        grade_low:
          type: integer
        grade_high:
          type: integer
        test:
          type: integer
        test_low:
          type: integer
        test_high:
          type: integer
    RegisterIn:
      type: object
      additionalProperties: false
      required: [email, password, birth_date]
      properties:
        email:
          type: string
          format: email
          minLength: 6
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        birth_date:
          type: string
          format: date
          description: Полных лет должно быть не меньше 14.
    LoginIn:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 254
          description: Почта или username — те же учётные данные, что на сайте.
        password:
          type: string
          minLength: 1
          maxLength: 128
    Auth:
      type: object
      additionalProperties: false
      required: [schema_version, token, created]
      properties:
        schema_version:
          type: integer
          enum: [1]
        token:
          type: string
          description: "Токен входа, заголовок Authorization: Bearer <токен>, для attempts/forecast/logout."
        created:
          type: boolean
    TodayTask:
      type: object
      additionalProperties: false
      required: [n, minutes, why, times]
      properties:
        n:
          type: integer
          description: Номер экзамена; условие даёт GET /tasks/{exam_id}/{n}, проверка — POST /attempts.
        minutes:
          type: integer
        why:
          type: string
          description: "«повторение» — подошёл срок повторения; иначе — наибольший прирост баллов за минуту."
        times:
          type: integer
          description: Сколько тренировок номера в плане сегодня.
        title:
          type: string
          description: Название номера, как на сайте; может не быть — тогда показывать «№n».
    Activity:
      type: object
      additionalProperties: false
      required: [streak, today, weekday, week, week_days, goal]
      properties:
        streak:
          type: integer
          description: Дней подряд; сегодняшний день ещё не потерян, пока он не кончился.
        today:
          type: boolean
          description: Сегодня уже была попытка.
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 — понедельник; week лежит пн..вс."
        week:
          type: array
          items:
            type: boolean
          description: Была ли попытка в каждый день текущей недели, с понедельника.
        week_days:
          type: integer
        goal:
          type: integer
          description: Цель недели — сколько дней с попытками нужно.
    Today:
      type: object
      additionalProperties: false
      required: [schema_version, exam_id, day, minutes, plan, activity]
      properties:
        schema_version:
          type: integer
          enum: [1]
        exam_id:
          type: string
        day:
          type: string
          format: date
          description: «Сегодня» по часам сервера — граница серии.
        minutes:
          type: integer
          description: Дневная норма ученика (u2_prefs, по умолчанию 30).
        plan:
          type: array
          items:
            $ref: "#/components/schemas/TodayTask"
        activity:
          $ref: "#/components/schemas/Activity"
          description: True — новый аккаунт; False — апгрейд гостя или вход существующего.
    NumbersOut:
      type: object
      additionalProperties: false
      required: [schema_version, exam_id, numbers]
      properties:
        schema_version:
          type: integer
          enum: [1]
        exam_id:
          type: string
        numbers:
          type: array
          items:
            type: integer
    ErrorItem:
      type: object
      additionalProperties: false
      required: [n, at]
      properties:
        n:
          type: integer
        seed:
          type: integer
        given:
          type: string
        at:
          type: string
    ErrorsOut:
      type: object
      additionalProperties: false
      required: [schema_version, exam_id, items]
      properties:
        schema_version:
          type: integer
          enum: [1]
        exam_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ErrorItem"
    MeOut:
      type: object
      additionalProperties: false
      required: [schema_version, id, display_name]
      properties:
        schema_version:
          type: integer
          enum: [1]
        id:
          type: integer
        display_name:
          type: string
        grade:
          type: integer
        subjects:
          type: string
    SkillOut:
      type: object
      additionalProperties: false
      required: [id, title, p, n, mastered]
      properties:
        id:
          type: string
        title:
          type: string
        p:
          type: number
        n:
          type: integer
        mastered:
          type: boolean
    SkillsOut:
      type: object
      additionalProperties: false
      required: [schema_version, exam_id, skills]
      properties:
        schema_version:
          type: integer
          enum: [1]
        exam_id:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillOut"
    TheoryItem:
      type: object
      additionalProperties: false
      required: [code, note]
      properties:
        code:
          type: string
        note:
          type: string
    TheoryLesson:
      type: object
      additionalProperties: false
      required: [lesson, title, items]
      properties:
        lesson:
          type: integer
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/TheoryItem"
    TheoryOut:
      type: object
      additionalProperties: false
      required: [schema_version, lessons]
      properties:
        schema_version:
          type: integer
          enum: [1]
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/TheoryLesson"
